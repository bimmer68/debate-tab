<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debate Tab</title>
  <!-- "?v=9" je broj verzije. Kad se promijeni bilo koji CSS ili JS fajl,
       povećaj ga svuda (v=9, v=10...), da browser ne koristi staru kopiju iz keša. -->
  <link rel="stylesheet" href="css/style.css?v=9">
  <!-- Tema se postavlja odmah, prije nego se stranica prikaže. -->
  <script src="js/theme.js?v=9"></script>
</head>
<body>
  <header class="zaglavlje">
    <a class="logo" href="#/">Debate Tab</a>
    <nav class="navigacija" aria-label="Glavna navigacija">
      <a href="#/postavke" data-stranica="postavke">Postavke</a>
      <a href="#/timovi" data-stranica="timovi">Timovi</a>
      <a href="#/sudije" data-stranica="sudije">Sudije</a>
      <a href="#/runde" data-stranica="runde">Runde</a>
      <a href="#/tab" data-stranica="tab">Tab</a>
    </nav>
    <button type="button" id="prekidac-teme" class="prekidac-teme">☀ Svijetla tema</button>
  </header>

  <main id="sadrzaj" class="sadrzaj">
    <!-- Ovdje JavaScript ubacuje sadržaj trenutne stranice. -->
  </main>

  <footer class="podnozje">
    Debate Tab · podaci se čuvaju samo u ovom browseru
  </footer>

  <!-- Redoslijed je bitan: prvo pomoćni fajlovi i podaci, pa stranice, pa navigacija, pa pokretanje. -->
  <script src="js/utils.js?v=9"></script>
  <script src="js/formats.js?v=9"></script>
  <script src="js/participants.js?v=9"></script>
  <script src="js/pairing.js?v=9"></script>
  <script src="js/rounds.js?v=9"></script>
  <script src="js/ballots.js?v=9"></script>
  <script src="js/tab.js?v=9"></script>
  <script src="js/storage.js?v=9"></script>
  <script src="js/settings.js?v=9"></script>
  <script src="js/teams.js?v=9"></script>
  <script src="js/judges.js?v=9"></script>
  <script src="js/rounds-page.js?v=9"></script>
  <script src="js/ballots-page.js?v=9"></script>
  <script src="js/tab-page.js?v=9"></script>
  <script src="js/pages.js?v=9"></script>
  <script src="js/router.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
